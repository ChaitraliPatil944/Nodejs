<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
    </head>
    <body>
        <h1>Welcome To The Login Page</h1>
        <a href="index.html">Home &nbsp; </a>
        <a href="login.html">Login &nbsp; </a>
        <a href="register.html">Register &nbsp; </a>
        <hr>
        <h2>Choose option</h2>
        <hr>
        <input type="text" id="username" placeholder="Username" autocomplete="username"><br>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password"><br>
        <button type="submit" id="myBtn" onclick="loginUser()">Login</button>
        <p id="para"></p>
        <script>
            function loginUser(){
                var username=document.getElementById("username").value;
                var password=document.getElementById("password").value;
                if(typeof(Storage)!=="undefined") {
                    var user=JSON.parse(localStorage.getItem("valid_user"));
                    if(user.username===username&&user.password===password){
                        document.getElementById("para").innerHTML="Login Successful";
                    }
                    else {
                        document.getElementById("para").innerHTML="Invalid Credentials";
                    }
                }
            }
        </script>
    </body>
</html>
