<!DOCTYPE html>
<html>
    <title>Paint Brush</title>
    <body>
        <h1 style="color: blueviolet ; font-family: Georgia, 'Times New Roman', Times, serif;"> Paint Brush</h1>

        <canvas id="myCanvas" width="500" height="500" style="border:1px solid #000000 ;">
            <p style="background-color: aquamarine;"> this is a canvas element</p>


            <script>
                function drawLine(event){
                    var canvas=document.getElementById("myCanvas");
                    var ctx=canvas.getContext("2d");
                    ctx.moveTo(0, 0); // starting point
                    ctx.lineTo(200, 100); // ending point
                    ctx.stroke(); // draw the line

                }
                //drawLine();

                function drawCircle(event){
                    var canvas=document.getElementById("myCanvas");
                    var ctx=canvas.getContext("2d");
                    ctx.beginPath();
                    ctx.arc(250, 250, 40, 0, 2 * Math.PI); // x,y,radius,start angle,end angle
                    ctx.stroke();
                    ctx.fillStyle="red";
                    ctx.fill();
                }
                //drawCircle();

                function drawRect(event){
                    var canvas=document.getElementById("myCanvas");
                    var ctx=canvas.getContext("2d");
                    ctx.fillStyle="green";
                    ctx.fillRect(300, 300, 150, 100); // x,y,width,height
                }
                drawRect();
            </script>
</html>
